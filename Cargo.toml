[workspace.package]
version = "0.1.0"
authors = ["Fastnear Inc <hello@fastnear.com>"]
edition = "2024"
repository = "https://github.com/fastnear/hos-treasury"
rust-version = "1.86"
license = "MIT OR Apache-2.0"

[workspace]
resolver = "3"
members = [
    "dao-timelock",
    "spending-account",
    "integration-tests",
]

[workspace.dependencies]
near-sdk = { version = "=5.9.0", features = ["wee_alloc", "unstable"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

[profile.dev]
overflow-checks = true

[profile.test]
overflow-checks = true

[profile.release]
codegen-units = 1
opt-level = "s"
lto = true
debug = false
panic = "abort"
overflow-checks = true
